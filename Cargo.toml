[package]
name = "liskov-runtime-cargo"
version = "0.10.14"
edition = "2024"
rust-version = "1.85"
description = "Static bootstrap and process supervisor for Liskov-managed Acurast Cargo/PRoot workloads"
license = "Apache-2.0"
repository = "https://github.com/proof-computer/liskov-runtime-cargo"
readme = "README.md"
keywords = ["liskov", "acurast", "proot", "runtime"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "liskov_runtime_cargo"
path = "src/lib.rs"

[[bin]]
name = "liskov-runtime-contact"
path = "src/bin/liskov-runtime-contact.rs"

# Evidence probe for provider work. `required-features` keeps it out of every
# default build and out of the release artifact, which builds
# `--bin liskov-runtime-contact` explicitly.
[[bin]]
name = "liskov-tunnel-probe"
path = "src/bin/liskov-tunnel-probe.rs"
required-features = ["tunnel-probe"]

[features]
tunnel-probe = []

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive"] }
flate2 = { version = "1.1.1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
getrandom = "0.3.3"
hex = "0.4.3"
libc = "0.2.189"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tar = { version = "0.4.44", default-features = false }
tokio = { version = "1.48.0", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5.4"
zeroize = "1.9.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
