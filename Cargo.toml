[package]
name = "liskov-runtime-cargo"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "Static bootstrap and process supervisor for Liskov-managed Acurast Cargo/PRoot workloads"
license = "Apache-2.0"
repository = "https://github.com/proof-computer/liskov-runtime-cargo"
readme = "README.md"
keywords = ["liskov", "acurast", "proot", "runtime"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "liskov_runtime_cargo"
path = "src/lib.rs"

[[bin]]
name = "liskov-runtime-contact"
path = "src/bin/liskov-runtime-contact.rs"

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive"] }
flate2 = { version = "1.1.1", default-features = false, features = ["rust_backend"] }
getrandom = "0.3.3"
hex = "0.4.3"
libc = "0.2.189"
ring = "0.17.14"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tar = { version = "0.4.44", default-features = false }
ureq = { version = "2.12.1", default-features = false, features = ["tls"] }
url = "2.5.4"
zeroize = "1.9.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
