name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish static AArch64 release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust target and inspection tools
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools
      - name: Build release helper
        run: cargo build --release --locked --target aarch64-unknown-linux-musl --bin liskov-runtime-contact
      - name: Build pinned static Dropbear toolchain
        run: |
          # Upstream is a single host and it does go down — it served HTTP 525
          # for hours on 2026-08-12 and blocked every helper release. Try the
          # mirror if it does. This is safe without trusting either host:
          # build-dropbear.sh pins expected_sha256 and hard-fails on mismatch,
          # so the digest, not the origin, is what is trusted.
          for url in \
            https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2 \
            https://dropbear.nl/mirror/releases/dropbear-2026.94.tar.bz2
          do
            echo "fetching dropbear source from $url"
            if curl --fail --location --silent --show-error \
                 --output /tmp/dropbear-2026.94.tar.bz2 "$url"; then
              break
            fi
            echo "source unavailable at $url" >&2
          done
          scripts/build-dropbear.sh /tmp/dropbear-2026.94.tar.bz2 target/dropbear-static
      - name: Verify executable and static ELF
        run: |
          artifact=target/aarch64-unknown-linux-musl/release/liskov-runtime-contact
          "$artifact" --version
          file "$artifact" | tee /tmp/liskov-runtime-contact-file.txt
          grep -q 'ELF 64-bit LSB.*ARM aarch64' /tmp/liskov-runtime-contact-file.txt
          readelf -h "$artifact" | grep -q 'Machine:.*AArch64'
          if readelf -l "$artifact" | grep -q 'Requesting program interpreter'; then
            echo "artifact unexpectedly contains a dynamic interpreter" >&2
            exit 1
          fi
          for artifact in target/dropbear-static/liskov-dropbear target/dropbear-static/liskov-dropbearkey; do
            file "$artifact" | grep -q 'ELF 64-bit LSB.*ARM aarch64'
            readelf -h "$artifact" | grep -q 'Machine:.*AArch64'
            if readelf -l "$artifact" | grep -q 'Requesting program interpreter'; then
              echo "$artifact unexpectedly contains a dynamic interpreter" >&2
              exit 1
            fi
          done
      - name: Package release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/package-release.sh \
            "$TAG" \
            "$GITHUB_SHA" \
            target/aarch64-unknown-linux-musl/release/liskov-runtime-contact \
            target/dropbear-static/liskov-dropbear \
            target/dropbear-static/liskov-dropbearkey \
            dist
      - name: Create draft GitHub release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          binary="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl"
          archive="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl.tar.gz"
          dropbear="dist/liskov-dropbear-2026.94-${TAG}-aarch64-unknown-linux-musl"
          dropbearkey="dist/liskov-dropbearkey-2026.94-${TAG}-aarch64-unknown-linux-musl"
          gh release create "$TAG" \
            "$binary" \
            "$archive" \
            "$dropbear" \
            "$dropbearkey" \
            dist/runtime-contact-release.json \
            dist/SHA256SUMS \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "Static AArch64 bootstrap and process supervisor for Liskov-managed Acurast Cargo/PRoot workloads."
      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/liskov-runtime-contact-${{ github.ref_name }}-aarch64-unknown-linux-musl
            dist/liskov-dropbear-2026.94-${{ github.ref_name }}-aarch64-unknown-linux-musl
            dist/liskov-dropbearkey-2026.94-${{ github.ref_name }}-aarch64-unknown-linux-musl
            dist/runtime-contact-release.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
      - name: Verify immutable release and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          binary="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl"
          archive="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl.tar.gz"
          dropbear="dist/liskov-dropbear-2026.94-${TAG}-aarch64-unknown-linux-musl"
          dropbearkey="dist/liskov-dropbearkey-2026.94-${TAG}-aarch64-unknown-linux-musl"
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done
          gh release verify-asset "$TAG" "$binary"
          gh release verify-asset "$TAG" "$archive"
          gh release verify-asset "$TAG" "$dropbear"
          gh release verify-asset "$TAG" "$dropbearkey"
          gh release verify-asset "$TAG" dist/runtime-contact-release.json
  notify:
    name: Notify Liskov release registry
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: Notify Liskov release registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          for attempt in 1 2 3 4 5 6 7 8; do
            status=000
            if token=$(
              curl --fail --silent --show-error \
                --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
                "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=liskov-runtime-contact-release" |
                jq -er '.value'
            ); then
              status=$(
                curl --silent --show-error \
                  --output "$response_file" \
                  --write-out '%{http_code}' \
                  --request POST \
                  --header "Authorization: Bearer ${token}" \
                  --header "Content-Type: application/json" \
                  --data "$(jq -cn --arg tag "$TAG" '{domain:"proof.liskov.runtime-contact-release.v1",tag:$tag}')" \
                  https://runtime.liskov.proof.computer/api/runtime-contact/releases/github
              ) || status=000
            fi

            if [ "$status" = 200 ] && jq -e '.ok == true' "$response_file" >/dev/null; then
              jq -c '{ok,tag,active,version,sourceCommit,binaryDigest}' "$response_file"
              exit 0
            fi

            retry=false
            case "$status" in
              # 000 is a transport failure; 429/502/503/504 all mean the
              # registry is momentarily unreachable or shedding load, which is
              # exactly what a concurrent control-plane deployment looks like
              # from here. None of them is a decision about the release.
              000|429|502|503|504) retry=true ;;
              422)
                if jq -e '.reason == "release_rejected"' "$response_file" >/dev/null 2>&1; then
                  retry=true
                fi
                ;;
            esac
            if [ "$retry" != true ] || [ "$attempt" -eq 8 ]; then
              echo "release registry notification failed with HTTP ${status}" >&2
              jq -c '{ok,error,reason}' "$response_file" >&2 2>/dev/null || true
              exit 1
            fi

            # The registry fences an interrupted ingest with a two-minute lease.
            # Wait past it and mint a fresh OIDC token before the next attempt.
            sleep 60
            sleep 60
            sleep 10
          done
