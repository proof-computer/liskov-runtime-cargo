name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish static AArch64 release
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust target and inspection tools
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools
      - name: Build release helper
        run: cargo build --release --locked --target aarch64-unknown-linux-musl --bin liskov-runtime-contact
      - name: Verify executable and static ELF
        run: |
          artifact=target/aarch64-unknown-linux-musl/release/liskov-runtime-contact
          "$artifact" --version
          file "$artifact" | tee /tmp/liskov-runtime-contact-file.txt
          grep -q 'ELF 64-bit LSB.*ARM aarch64' /tmp/liskov-runtime-contact-file.txt
          readelf -h "$artifact" | grep -q 'Machine:.*AArch64'
          if readelf -l "$artifact" | grep -q 'Requesting program interpreter'; then
            echo "artifact unexpectedly contains a dynamic interpreter" >&2
            exit 1
          fi
      - name: Package release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          scripts/package-release.sh \
            "$TAG" \
            "$GITHUB_SHA" \
            target/aarch64-unknown-linux-musl/release/liskov-runtime-contact \
            dist
      - name: Create draft GitHub release with all assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          binary="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl"
          archive="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl.tar.gz"
          gh release create "$TAG" \
            "$binary" \
            "$archive" \
            dist/runtime-contact-release.json \
            dist/SHA256SUMS \
            --draft \
            --verify-tag \
            --title "$TAG" \
            --notes "Static AArch64 bootstrap and process supervisor for Liskov-managed Acurast Cargo/PRoot workloads."
      - name: Attest release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/liskov-runtime-contact-${{ github.ref_name }}-aarch64-unknown-linux-musl
            dist/liskov-runtime-contact-${{ github.ref_name }}-aarch64-unknown-linux-musl.tar.gz
            dist/runtime-contact-release.json
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
      - name: Verify immutable release and exact assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          binary="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl"
          archive="dist/liskov-runtime-contact-${TAG}-aarch64-unknown-linux-musl.tar.gz"
          for attempt in 1 2 3 4 5 6; do
            if gh release verify "$TAG"; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done
          gh release verify-asset "$TAG" "$binary"
          gh release verify-asset "$TAG" "$archive"
          gh release verify-asset "$TAG" dist/runtime-contact-release.json
      - name: Notify Liskov release registry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          token=$(
            curl --fail --silent --show-error \
              --header "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=liskov-runtime-contact-release" |
              jq -er '.value'
          )
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 5 \
            --retry-max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${token}" \
            --header "Content-Type: application/json" \
            --data "$(jq -cn --arg tag "$TAG" '{domain:"proof.liskov.runtime-contact-release.v1",tag:$tag}')" \
            https://liskov.proof.computer/api/runtime-contact/releases/github
