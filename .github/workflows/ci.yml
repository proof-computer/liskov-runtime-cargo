name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust 1.85 gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Verify deterministic release contract
        run: scripts/test-package-release.sh

  aarch64-static:
    name: Native AArch64 static artifact
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target and inspection tools
        run: |
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install --yes binutils file musl-tools netcat-openbsd openssh-client
      - name: Build release helper
        run: cargo build --release --locked --target aarch64-unknown-linux-musl --bin liskov-runtime-contact
      - name: Build evidence probe
        run: cargo build --release --locked --target aarch64-unknown-linux-musl --features tunnel-probe --bin liskov-tunnel-probe
      - name: Build pinned static Dropbear toolchain
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/dropbear-2026.94.tar.bz2 \
            https://matt.ucc.asn.au/dropbear/releases/dropbear-2026.94.tar.bz2
          scripts/build-dropbear.sh /tmp/dropbear-2026.94.tar.bz2 target/dropbear-static
      - name: Verify executable and static ELF
        run: |
          artifact=target/aarch64-unknown-linux-musl/release/liskov-runtime-contact
          "$artifact" --version
          file "$artifact" | tee /tmp/liskov-runtime-contact-file.txt
          grep -q 'ELF 64-bit LSB.*ARM aarch64' /tmp/liskov-runtime-contact-file.txt
          readelf -h "$artifact" | grep -q 'Machine:.*AArch64'
          if readelf -l "$artifact" | grep -q 'Requesting program interpreter'; then
            echo "artifact unexpectedly contains a dynamic interpreter" >&2
            exit 1
          fi
          for artifact in target/aarch64-unknown-linux-musl/release/liskov-tunnel-probe target/dropbear-static/liskov-dropbear target/dropbear-static/liskov-dropbearkey; do
            file "$artifact" | grep -q 'ELF 64-bit LSB.*ARM aarch64'
            readelf -h "$artifact" | grep -q 'Machine:.*AArch64'
            if readelf -l "$artifact" | grep -q 'Requesting program interpreter'; then
              echo "$artifact unexpectedly contains a dynamic interpreter" >&2
              exit 1
            fi
          done
      - name: Stage exact runtime toolchain candidate
        run: |
          mkdir candidate-dist
          install -m 0755 target/aarch64-unknown-linux-musl/release/liskov-runtime-contact candidate-dist/liskov-runtime-contact
          install -m 0755 target/aarch64-unknown-linux-musl/release/liskov-tunnel-probe candidate-dist/liskov-tunnel-probe
          install -m 0755 target/dropbear-static/liskov-dropbear candidate-dist/liskov-dropbear
          install -m 0755 target/dropbear-static/liskov-dropbearkey candidate-dist/liskov-dropbearkey
          install -m 0755 /usr/bin/ssh candidate-dist/test-openssh
          install -m 0755 /usr/bin/ssh-keygen candidate-dist/test-ssh-keygen
          install -m 0755 /usr/bin/nc candidate-dist/test-nc
          install -m 0755 /lib/ld-linux-aarch64.so.1 candidate-dist/test-ld-linux
          mkdir candidate-dist/test-libs
          mapfile -t stock_client_libraries < <(
            ldd /usr/bin/ssh /usr/bin/ssh-keygen /usr/bin/nc \
              | awk '$2 == "=>" && $3 ~ /^\// { print $3 } $1 ~ /^\// && $1 !~ /:$/ { print $1 }' \
              | sort -u
          )
          for library in "${stock_client_libraries[@]}"; do
            install -m 0644 "$library" "candidate-dist/test-libs/$(basename "$library")"
          done
      - name: Upload exact AArch64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: liskov-runtime-contact-aarch64-candidate
          path: candidate-dist
          if-no-files-found: error

  qemu-proot:
    name: QEMU/PRoot maintained-image smoke
    runs-on: ubuntu-latest
    needs: aarch64-static
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU/PRoot tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes proot qemu-user-static xz-utils
      - name: Download exact AArch64 candidate
        uses: actions/download-artifact@v4
        with:
          name: liskov-runtime-contact-aarch64-candidate
          path: candidate
      - name: Restore exact candidate executable modes
        run: |
          chmod 0755 \
            candidate/liskov-runtime-contact \
            candidate/liskov-tunnel-probe \
            candidate/liskov-dropbear \
            candidate/liskov-dropbearkey \
            candidate/test-openssh \
            candidate/test-ssh-keygen \
            candidate/test-nc \
            candidate/test-ld-linux
      - name: Exercise helper under QEMU/PRoot
        run: scripts/smoke-qemu-proot.sh candidate/liskov-runtime-contact
      - name: Exercise reusable local emulator profiles
        run: |
          scripts/run-qemu-proot-runtime.sh --self-test
          scripts/run-qemu-proot-runtime.sh --profile netlink-denied --self-test
      - name: Exercise tunnel evidence probe under both fault profiles
        run: scripts/test-tunnel-probe-qemu-proot.sh candidate/liskov-tunnel-probe
      - name: Exercise managed Dropbear access through stock OpenSSH
        run: |
          scripts/run-qemu-proot-runtime.sh --no-shim -- \
            /workspace/tools/qemu-proot/managed-access-smoke.sh \
            /workspace/candidate/liskov-dropbear \
            /workspace/candidate/liskov-dropbearkey \
            /workspace/candidate/test-ld-linux \
            /workspace/candidate/test-libs \
            /workspace/candidate/test-openssh \
            /workspace/candidate/test-ssh-keygen \
            /workspace/candidate/test-nc
      - name: Validate opt-in provider-real gate syntax
        run: |
          bash -n scripts/test-tailscale-saas-runtime-ssh.sh
          sh -n tools/qemu-proot/tailscale-saas-runner.sh
          node --check tools/qemu-proot/tailscale-saas-controller.mjs
          scripts/test-tailscale-saas-runtime-ssh.sh --help >/dev/null
